# Unit tests + typecheck. Does not launch Electron or talk to a real SSH host.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      # workspace-manager tests `git commit` in temp repos; runners have no git identity.
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v4

      # Node 24 LTS. Not 26: extract-zip@2/yauzl@2 in Electron's installer can
      # silently half-unpack there (see CLAUDE.md, "Electron binary install").
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          # @electron/get default cache dirs (macOS, Linux, Windows).
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-

      # postinstall runs @electron/rebuild, which compiles node-pty from source.
      # Its binding.gyp requests SpectreMitigation on Windows (MSB8040 without the
      # Spectre-mitigated MSVC libs). Add the component only if the image lacks it.
      - name: Ensure MSVC Spectre-mitigated libs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $component = 'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre'
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) { throw 'No Visual Studio install with the C++ toolset found' }
          $has = & $vswhere -latest -products * -requires $component -property installationPath
          if ($has) {
            Write-Host "Spectre libs already present in $installPath"
          } else {
            Write-Host "Adding $component to $installPath"
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', "`"$installPath`"", '--add', $component,
              '--quiet', '--norestart', '--nocache'
            )
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "vs_installer exited $($p.ExitCode)" }
          }

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        if: runner.os == 'Linux'
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        if: runner.os == 'Linux'
        run: npm run build

      # Fails if the server's graph reaches electron; --check runs a PTY on the bundled node-pty.
      - name: Build server bundle
        if: runner.os == 'Linux'
        run: npm run build:server && node out/server/main.js --check

  # Native notebooks run their kernel through conda + jupyter_client. This job
  # installs a real conda env and fails if the live kernel smoke cannot run.
  notebook-live-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      # Fail this job if conda / ipykernel / jupyter_client cannot be resolved.
      NOTEBOOK_LIVE_REQUIRED: '1'
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          python-version: '3.12'
          activate-environment: notebook-smoke
          auto-activate-base: false
          conda-forge: true
      - name: Install ipykernel and jupyter_client
        shell: bash -el {0}
        run: python -m pip install ipykernel jupyter_client
      - name: Check jupyter in the conda env
        shell: bash -el {0}
        run: python -c "import jupyter_client, ipykernel; print('jupyter ok')"
      # Skip Electron postinstall / node-pty rebuild; the matrix job covers that.
      # Tests do not import electron or node-pty. esbuild still needs its binary.
      - name: Install JS deps without native Electron rebuild
        run: npm ci --ignore-scripts
      - name: Download esbuild binary
        run: node node_modules/esbuild/install.js
      - name: Run unit tests and live kernel smoke
        run: npm test
