# Generate the Xcode project with:  cd ios && xcodegen generate
# DevTool.xcodeproj is generated and gitignored; edit this file instead.
name: DevTool

options:
  bundleIdPrefix: sk.awantech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "21"

packages:
  DevToolKit:
    path: DevToolKit

targets:
  DevTool:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DevTool
    dependencies:
      - package: DevToolKit
      - target: DevToolNotifications
    info:
      path: DevTool/Info.plist
      properties:
        CFBundleDisplayName: DevTool
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Export compliance: all cryptography is Apple's own (CryptoKit, Security,
        # URLSession TLS). The Noise protocol is built on CryptoKit primitives.
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: DevTool uses the camera to scan the pairing QR code shown on your desktop.
        NSFaceIDUsageDescription: DevTool can ask for Face ID before you answer an agent's permission request, question or plan.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: sk.awantech.devtool.pair
            CFBundleURLSchemes:
              - devtool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.awantech.devtool
        PRODUCT_NAME: DevTool
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # aps-environment, the App Group and keychain groups (push, SPEC.md §7).
        CODE_SIGN_ENTITLEMENTS: DevTool/DevTool.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AX23G9CAL9
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ENABLE_PREVIEWS: YES
    scheme:
      commandLineArguments:
        # Preloads mock desktops (no relay needed). Untick to use persisted pairings.
        "-mockDesktop": true

  # Notification Service Extension: decrypts pushes (SPEC.md §7.5, §7.7).
  DevToolNotifications:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DevToolNotifications
    dependencies:
      - package: DevToolKit
    info:
      path: DevToolNotifications/Info.plist
      properties:
        CFBundleDisplayName: DevTool Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.awantech.devtool.notifications
        PRODUCT_NAME: DevToolNotifications
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AX23G9CAL9
        CODE_SIGN_ENTITLEMENTS: DevToolNotifications/DevToolNotifications.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        APPLICATION_EXTENSION_API_ONLY: YES
